# Chạy Collector agent trên máy ứng dụng. Project hiện hành: flash-ticket-collector.
# docker compose -p flash-ticket-collector -f agent-compose.yaml --env-file ../../inventory/oracle-exp.env up -d
services:
  collector:
    image: otel/opentelemetry-collector-contrib@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    container_name: flash-ticket-collector
    user: 0:0
    network_mode: host
    restart: unless-stopped
    mem_limit: 512m
    command:
    - --config=/etc/otel/config.yaml
    env_file:
    - ${RCA_LAB_SECRETS:-/etc/rca-lab}/collector.env
    volumes:
    - ./agent-docker-host.yaml:/etc/otel/config.yaml:ro
    - ${RCA_LAB_DATA:-/srv/rca-lab}/collector-agent:/data
    - /var/lib/docker/containers:/var/lib/docker/containers:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - /:/hostfs:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      APP_PRIVATE_IP: ${APP_PRIVATE_IP}
      OBS_PRIVATE_IP: ${OBS_PRIVATE_IP}
