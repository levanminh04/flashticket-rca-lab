# Collector AGENT trên máy ứng dụng chạy Docker Compose (exp-app).
# Nhận OTLP từ Java agent qua localhost; tự đọc log container, docker_stats, hostmetrics, metric DB,
# kiểm liveness (httpcheck); gửi một đường OTLP sang gateway. Mật khẩu lấy từ biến môi trường.
extensions:
  file_storage:
    directory: /data/queue
    create_directory: true
  health_check:
    endpoint: 127.0.0.1:13133
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318
  otlp/keycloak:
    protocols:
      http:
        endpoint: ${env:APP_PRIVATE_IP}:4318
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 10s
    excluded_images:
    - '*pumba*'
    - '*toxiproxy*'
    - '*k6*'
    - otel/opentelemetry-collector-contrib*
    container_labels_to_metric_labels:
      com.docker.compose.service: service.name
    metrics:
      container.cpu.throttling_data.periods:
        enabled: true
      container.cpu.throttling_data.throttled_periods:
        enabled: true
      container.cpu.throttling_data.throttled_time:
        enabled: true
      container.cpu.limit:
        enabled: true
      container.restarts:
        enabled: true
      container.uptime:
        enabled: true
      container.pids.count:
        enabled: true
  hostmetrics:
    root_path: /hostfs
    collection_interval: 10s
    scrapers:
      cpu: {}
      memory: {}
      load: {}
      disk: {}
      network: {}
      filesystem: {}
  postgresql:
    endpoint: 127.0.0.1:5432
    username: otel_monitor
    password: ${env:POSTGRES_MONITOR_PASSWORD}
    databases:
    - keycloak_db
    - event_db
    - booking_db
    - payment_db
    - ticket_db
    collection_interval: 10s
    tls:
      insecure: true
  mongodb:
    hosts:
    - endpoint: 127.0.0.1:27017
    username: otel_monitor
    password: ${env:MONGODB_MONITOR_PASSWORD}
    collection_interval: 10s
    tls:
      insecure: true
  redis:
    endpoint: 127.0.0.1:6379
    password: ${env:REDIS_PASSWORD}
    collection_interval: 10s
  rabbitmq:
    endpoint: http://127.0.0.1:15672
    username: otel_monitor
    password: ${env:RABBITMQ_MONITOR_PASSWORD}
    collection_interval: 10s
  prometheus/self:
    config:
      scrape_configs:
      - job_name: local-collector
        scrape_interval: 10s
        static_configs:
        - targets:
          - 127.0.0.1:8888
  filelog/docker:
    include:
    - /var/lib/docker/containers/*/*-json.log
    - /var/lib/docker/containers/*/*-json.log.*
    start_at: end
    storage: file_storage
    include_file_path: true
    operators:
    - type: json_parser
      id: docker
      parse_to: attributes.docker
      timestamp:
        parse_from: attributes.docker.time
        layout_type: gotime
        layout: 2006-01-02T15:04:05.999999999Z07:00
    - type: filter
      id: bo-khong-nhan
      expr: attributes.docker.attrs == nil || attributes.docker.attrs["com.docker.compose.service"] == nil
    - type: move
      from: attributes.docker.log
      to: body
    - type: add
      field: resource["service.instance.id"]
      value: EXPR(attributes.docker.attrs["com.docker.compose.service"] + "-" + (attributes.docker.attrs["com.docker.compose.container-number"] ?? "1"))
    - type: move
      from: attributes.docker.attrs["com.docker.compose.service"]
      to: resource["service.name"]
    - type: json_parser
      id: spring
      parse_from: body
      parse_to: attributes.app
      if: body matches "^\\s*\\{"
      on_error: send
  httpcheck:
    collection_interval: 10s
    targets:
    - endpoint: http://${env:APP_PRIVATE_IP}:8081/actuator/health/liveness
      method: GET
    - endpoint: http://127.0.0.1:8082/actuator/health/liveness
      method: GET
    - endpoint: http://127.0.0.1:8083/actuator/health/liveness
      method: GET
    - endpoint: http://127.0.0.1:8084/actuator/health/liveness
      method: GET
    - endpoint: http://127.0.0.1:8085/actuator/health/liveness
      method: GET
    - endpoint: http://127.0.0.1:8086/actuator/health/liveness
      method: GET
    - endpoint: http://127.0.0.1:8761/actuator/health/liveness
      method: GET
    - endpoint: http://${env:APP_PRIVATE_IP}:8080/realms/master
      method: GET
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 64
  resource/host:
    attributes:
    - key: host.id
      value: exp-app
      action: upsert
    - key: deployment.environment
      value: exp
      action: upsert
  batch:
    timeout: 1s
    send_batch_size: 1024
  filter/health:
    error_mode: ignore
    traces:
      span:
      - attributes["http.route"] == "/actuator/health"
      - IsMatch(attributes["url.path"], "^/actuator/health")
  transform/sanitize:
    error_mode: ignore
    trace_statements:
    - context: span
      statements:
      - delete_key(attributes, "url.query")
      - replace_pattern(attributes["url.full"], "[?].*", "") where attributes["url.full"] != nil
      - replace_pattern(attributes["http.url"], "[?].*", "") where attributes["http.url"] != nil
      - replace_pattern(attributes["http.target"], "[?].*", "") where attributes["http.target"] != nil
  transform/ten-ha-tang:
    error_mode: ignore
    log_statements:
    - context: resource
      statements:
      - set(attributes["service.name"], "postgresql-shared-instance") where attributes["service.name"] == "postgres"
      - set(attributes["service.name"], "cache") where attributes["service.name"] == "redis"
      - set(attributes["service.name"], "broker") where attributes["service.name"] == "rabbitmq"
      - set(attributes["service.name"], "mongodb-instance") where attributes["service.name"] == "user-db"
exporters:
  otlp:
    endpoint: ${env:OBS_PRIVATE_IP}:4317
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      queue_size: 1000
      storage: file_storage
  file/traces:
    path: /data/traces.jsonl
    rotation:
      max_megabytes: 100
      max_backups: 10
  file/logs:
    path: /data/logs.jsonl
    rotation:
      max_megabytes: 50
      max_backups: 5
service:
  extensions:
  - file_storage
  - health_check
  telemetry:
    metrics:
      readers:
      - pull:
          exporter:
            prometheus:
              host: 127.0.0.1
              port: 8888
  pipelines:
    traces:
      receivers:
      - otlp
      - otlp/keycloak
      processors:
      - memory_limiter
      - filter/health
      - transform/sanitize
      - resource/host
      - batch
      exporters:
      - otlp
      - file/traces
    metrics:
      receivers:
      - otlp
      - otlp/keycloak
      - docker_stats
      - hostmetrics
      - postgresql
      - mongodb
      - redis
      - rabbitmq
      - prometheus/self
      - httpcheck
      processors:
      - memory_limiter
      - resource/host
      - batch
      exporters:
      - otlp
    logs:
      receivers:
      - filelog/docker
      processors:
      - memory_limiter
      - transform/ten-ha-tang
      - resource/host
      - batch
      exporters:
      - otlp
      - file/logs
