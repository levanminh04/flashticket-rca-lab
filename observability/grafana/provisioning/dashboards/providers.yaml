# Nạp dashboard từ file (T-068): mỗi thư mục Grafana một provider; tên hiển thị tiếng Việt đặt ở `folder`.
# dashboards/90-archive/ KHÔNG được provider nào quét (xem observability/grafana/README.md để nạp lại khi cần, ví dụ W5).
apiVersion: 1
providers:
  - name: bat-dau
    type: file
    folder: Bắt đầu tại đây
    folderUid: rca-bat-dau
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards/00-start-here
  - name: he-thong
    type: file
    folder: Hệ thống FlashTicket
    folderUid: rca-he-thong
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards/10-system
  - name: su-co
    type: file
    folder: RCA — sự cố
    folderUid: rca-su-co
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards/20-incidents
  - name: phat-lai
    type: file
    folder: RCA — phát lại có đáp án
    folderUid: rca-phat-lai
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards/30-replay
  # T-073 E5 (commit P, tạm): nạp 6 dashboard lưu trữ để kiểm khi đổi nguồn JSON (W5); trả về commit E5 ngay sau kiểm.
  # Cấu hình theo observability/grafana/README.md (không đặt folder/folderUid cùng foldersFromFilesStructure).
  - name: luu-tru-tam
    type: file
    options:
      path: /etc/grafana/dashboards/90-archive
      foldersFromFilesStructure: true
