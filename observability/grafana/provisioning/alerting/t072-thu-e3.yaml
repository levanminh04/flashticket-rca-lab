# T-072 E3: luật THỬ (bản sao p95, ngưỡng 0,005 s). Phải gỡ bằng t072-thu-e3-go.yaml (commit G) trước giờ hiệu lực E4.
# Sinh bởi results/T-072/sinh_luat_thu_e3.py nap. Không sửa tay.
apiVersion: 1
groups:
- orgId: 1
  name: t072-e3-thu
  folder: T-072 E3 thử (gỡ trước E4)
  interval: 10s
  rules:
  - uid: t072-thu-p95-booking
    title: t072-thu-p95-booking
    condition: C
    data:
    - refId: A
      relativeTimeRange: &id001
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: histogram_quantile(0.95, sum by (http_route, le) (rate(http_server_request_duration_seconds_bucket{service_name="api-gateway",http_route="booking"}[5m]))) and on (http_route) (sum by (http_route) (increase(http_server_request_duration_seconds_count{service_name="api-gateway",http_route="booking"}[5m])) >= 30)
        instant: true
        range: false
        intervalMs: 10000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        datasource:
          type: __expr__
          uid: __expr__
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.005
    noDataState: OK
    execErrState: Error
    for: 60s
    isPaused: false
    labels:
      t072_loai: thu
      t072_tin_hieu: p95-thu
      t072_uid: t072-thu-p95-booking
      http_route: booking
      service_name: api-gateway
    annotations:
      summary: THỬ E3 — bản sao t072-p95-booking, ngưỡng thử 0.005 s
      t072_eval_interval_s: '10'
      t072_for_s: '60'
      t072_nguong: '0.005'
      t072_nguong_phien_ban: thu-e3
      t072_bieu_thuc: T072-bieu-thuc-1
    notification_settings:
      receiver: t072-bo-nhan-nhe
      group_by:
      - '...'
      group_wait: 0s
