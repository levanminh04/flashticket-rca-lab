# Bốn nguồn dữ liệu của Grafana. UID cố định (prometheus, loki, tempo); dashboard trỏ theo UID.
apiVersion: 1
datasources:
- name: Prometheus
  uid: prometheus
  type: prometheus
  access: proxy
  url: http://prometheus:9090
  isDefault: true
  jsonData:
    httpMethod: POST
- name: Loki
  uid: loki
  type: loki
  access: proxy
  url: http://loki:3100
  jsonData:
    derivedFields:
    - name: TraceID
      matcherRegex: '"traceId"\s*:\s*"([a-f0-9]{32})"'
      datasourceUid: tempo
      url: $${__value.raw}
- name: Tempo
  uid: tempo
  type: tempo
  access: proxy
  url: http://tempo:3200
  jsonData:
    httpMethod: GET
    serviceMap:
      datasourceUid: prometheus
    tracesToLogsV2:
      datasourceUid: loki
      spanStartTimeShift: -1m
      spanEndTimeShift: 1m
      tags:
      - key: service.name
        value: service_name
      filterByTraceID: true
