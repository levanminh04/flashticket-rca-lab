# File phủ của lab lên deploy/app/payment-service.yml của nhóm (T-067). Dựng cấu hình hiệu lực bằng
#   docker compose -f <worktree>/deploy/app/payment-service.yml -f payment-service.yml config
# Giữ đúng điều kiện chạy của bản T-062 (compose-t062): env đã bỏ -javaagent, bật agent trong image,
# giới hạn tài nguyên và thư mục tiêm lỗi như cũ; nhãn log Docker để Collector gắn tên service.
services:
  payment-service:
    env_file: !override
      - ${RCA_APP_ENV_DIR:?RCA_APP_ENV_DIR}/payment-service.env
    environment:
      SERVICE_VERSION: ${SERVICE_VERSION:?SERVICE_VERSION}
    mem_limit: 1g
    logging:
      options:
        labels: "com.docker.compose.service,com.docker.compose.container-number"
  # Lab dùng mock VNPay; không mở đường hầm ngrok ra Internet. Biến bắt buộc của ngrok nhận giá trị giả
  # từ --env-file (/etc/flashticket-rca/payment-ngrok-gia.env) chỉ để file của nhóm nội suy được.
  ngrok:
    profiles: ["disabled"]
