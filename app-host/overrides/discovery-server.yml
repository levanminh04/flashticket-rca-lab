# File phủ của lab lên deploy/app/discovery-server.yml của nhóm (T-067). Dựng cấu hình hiệu lực bằng
#   docker compose -f <worktree>/deploy/app/discovery-server.yml -f discovery-server.yml config
# Giữ đúng điều kiện chạy của bản T-062 (compose-t062): env đã bỏ -javaagent, bật agent trong image,
# giới hạn tài nguyên và thư mục tiêm lỗi như cũ; nhãn log Docker để Collector gắn tên service.
services:
  discovery-server:
    env_file: !override
      - ${RCA_APP_ENV_DIR:?RCA_APP_ENV_DIR}/discovery-server.env
    environment:
      SERVICE_VERSION: ${SERVICE_VERSION:?SERVICE_VERSION}
    mem_limit: 768m
    logging:
      options:
        labels: "com.docker.compose.service,com.docker.compose.container-number"
